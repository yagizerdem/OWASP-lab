version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sqlserver
    environment:
      MSSQL_PID: "developer" # Use the developer edition of SQL Server
      ACCEPT_EULA: "Y"
      DB_USER: "sa"
      MSSQL_SA_PASSWORD: "12345aA!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql
    networks:
      - env_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  adminer:
    depends_on:
      - sqlserver
    image: adminer
    restart: always
    networks:
      - env_net
    ports:
      - 8080:8080

  authenticationfailures:
    depends_on:
      - sqlserver
    build:
      context: ./Lab
      dockerfile: AuthenticationFailures/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:5000;http://+:5001
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AuthenticationFailures_LAB;User Id=sa;Password=12345aA!;TrustServerCertificate=True"
    networks:
      - env_net
    ports:
      - 5000:5000
      - 5001:5001

  brokenaccesscontrol:
    depends_on:
      sqlserver:
        condition: service_healthy
    build:
      context: ./Lab
      dockerfile: BrokenAccessControl/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:5010;http://+:5011
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BrokenAccessControl_LAB;User Id=sa;Password=12345aA!;TrustServerCertificate=True"
    networks:
